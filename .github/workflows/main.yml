name: system-crypto-ci

on:
  workflow_dispatch:
    inputs:
      force_version:
        description: "The version to use"
        required: true
        default: "0.0.0-test"
        type: string
  push:
    branches:
      - main
      - "release/**"
  pull_request:
    branches:
      - main
      - "release/**"
  release:
    types:
      - published

env:
  # Setting these variables allows .NET CLI to use rich color codes in console output
  TERM: xterm
  DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: true
  # Skip boilerplate output
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # Determine version
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Determine stable version
        id: stable-version
        if: ${{ github.event_name == 'release' }}
        env:
          # Passed via the environment rather than interpolated into the script:
          # a ${{ }} expression is substituted into the script text before bash
          # runs it, so a hostile tag name could break out of the string below
          # -- including out of the validation check itself.
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          if ! [[ "$TAG_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[a-zA-Z].*)?$ ]]; then
              echo "Invalid version: $TAG_NAME"
              exit 1
          fi

          echo "version=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Determine prerelease version
        id: pre-version
        if: ${{ github.event_name != 'release' }}
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "version=0.0.0-ci-${HEAD_SHA:0:7}" >> "$GITHUB_OUTPUT"

    outputs:
      version: ${{ github.event.inputs.force_version || steps.stable-version.outputs.version || steps.pre-version.outputs.version }}

  # Check formatting
  #   format:
  #     runs-on: ubuntu-latest
  #     permissions:
  #       contents: read

  #     steps:
  #       - name: Checkout
  #         uses: actions/checkout@ac593985615ec2ede58e132d2e21d2b1cbd6127c # v3.3.0

  #       - name: Install .NET
  #         uses: actions/setup-dotnet@607fce577a46308457984d59e4954e075820f10a # v3.0.3

  #       - name: Validate format
  #         run: dotnet format --verify-no-changes

  # Run tests
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install .NET
        uses: actions/setup-dotnet@3951f0dfe7a07e2313ec93c75700083e2005cbab # v4.3.0
        with:
          dotnet-version: "8.0.x"

      - name: Run restore
        run: dotnet restore

      - name: Verify excluded cryptography is absent
        run: bash Scripts/verify-no-excluded-crypto.sh

      - name: Run build
        run: >
          dotnet build
          --no-restore
          --configuration Release

      - name: Run tests
        run: >
          dotnet test
          --no-restore
          --no-build
          --configuration Release
          ${{ runner.os == 'Windows' && '-p:IncludeNetCoreAppTargets=false' || '' }}
          --logger "trx;LogFileName=pw-test-results.trx"
          --collect:"XPlat Code Coverage"
          --
          RunConfiguration.CollectSourceInformation=true

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  # Pack the output into NuGet packages
  pack:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install .NET
        uses: actions/setup-dotnet@3951f0dfe7a07e2313ec93c75700083e2005cbab # v4.3.0
        with:
          dotnet-version: "8.0.x"

      - name: Run restore
        run: dotnet restore

      - name: Run build
        env:
          # See the note in the version job: force_version is caller-supplied
          # and reaches this script unvalidated, so keep it out of the script
          # text. This job builds the .nupkg that deploy-nuget publishes.
          VERSION: ${{ needs.version.outputs.version }}
        run: >
          dotnet build
          --no-restore
          --configuration Release
          -p:ContinuousIntegrationBuild=true
          "-p:Version=$VERSION"

      - name: Run pack
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: >
          dotnet pack
          "-p:Version=$VERSION"
          -p:ContinuousIntegrationBuild=true
          --no-restore
          --no-build
          --configuration Release

      # Static web assets are enumerated when the project is evaluated, so anything a build step generates
      # into wwwroot afterwards is silently left out of the package (#633). Fail here rather than on NuGet.
      - name: Check Fido2.BlazorWebAssembly ships its JavaScript module
        run: |
          pkg=$(ls Src/Fido2.BlazorWebAssembly/bin/Release/Fido2.BlazorWebAssembly.*.nupkg)
          unzip -l "$pkg" | grep -q 'staticwebassets/js/WebAuthn.js$' || { echo "::error::$pkg is missing staticwebassets/js/WebAuthn.js"; unzip -l "$pkg"; exit 1; }

      - name: Verify package dependency graphs and assets
        run: bash Scripts/verify-no-excluded-crypto.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: packages
          path: "**/*.nupkg"
